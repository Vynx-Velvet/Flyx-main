<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#08090b" />
    <meta name="color-scheme" content="dark" />
    <title>Flyx — Your screen. Your rules.</title>
    <meta
      name="description"
      content="Flyx is a private, open-source entertainment platform. Explore the source on GitHub or join the community on Discord."
    />
    <meta property="og:title" content="Flyx — Your screen. Your rules." />
    <meta
      property="og:description"
      content="Private, open-source entertainment. Built in the open and hosted by you."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <section class="card" aria-labelledby="page-title">
        <div class="ambient ambient-one" aria-hidden="true"></div>
        <div class="ambient ambient-two" aria-hidden="true"></div>

        <header>
          <a class="brand" href="/" aria-label="Flyx home">
            <span class="brand-mark" aria-hidden="true"><span></span></span>
            <span>FLYX</span>
          </a>
          <span class="status"><i></i> Open source</span>
        </header>

        <div class="content">
          <p class="eyebrow">Privacy-first entertainment</p>
          <h1 id="page-title">Your screen.<br /><em>Your rules.</em></h1>
          <p class="lede">
            A private, self-hosted home for movies, television, anime, manga, live TV, and sports.
            No ads. No tracking. No accounts here.
          </p>

          <nav class="actions" aria-label="Flyx links">
            <a
              class="button primary"
              href="https://github.com/Vynx-Velvet/Flyx-main"
              target="_blank"
              rel="noopener noreferrer"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M12 .7a11.5 11.5 0 0 0-3.64 22.4c.58.1.79-.25.79-.56v-2.23c-3.22.7-3.9-1.36-3.9-1.36-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.78 1.2 1.78 1.2 1.04 1.77 2.72 1.26 3.38.96.1-.75.4-1.26.74-1.55-2.57-.3-5.28-1.29-5.28-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.16 1.18a10.94 10.94 0 0 1 5.76 0c2.19-1.49 3.16-1.18 3.16-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.71 5.39-5.29 5.68.42.36.79 1.07.79 2.15v3.19c0 .31.21.67.79.56A11.5 11.5 0 0 0 12 .7Z"
                />
              </svg>
              View on GitHub
              <span aria-hidden="true">↗</span>
            </a>
            <a
              class="button secondary"
              href="https://discord.gg/flyx"
              target="_blank"
              rel="noopener noreferrer"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M19.5 5.34A16.3 16.3 0 0 0 15.44 4l-.5 1.02a15.04 15.04 0 0 0-5.86 0L8.56 4A16.6 16.6 0 0 0 4.5 5.35C1.93 9.18 1.23 12.9 1.58 16.57a16.4 16.4 0 0 0 4.98 2.51l1.2-1.64a10.8 10.8 0 0 1-1.88-.9l.46-.35a11.7 11.7 0 0 0 11.32 0l.47.35c-.6.35-1.24.65-1.89.9l1.2 1.64a16.3 16.3 0 0 0 4.98-2.51c.41-4.25-.7-7.94-2.92-11.23ZM8.52 14.34c-1 0-1.82-.92-1.82-2.04s.8-2.04 1.82-2.04c1.02 0 1.84.92 1.82 2.04 0 1.12-.8 2.04-1.82 2.04Zm6.96 0c-1 0-1.82-.92-1.82-2.04s.8-2.04 1.82-2.04c1.02 0 1.84.92 1.82 2.04 0 1.12-.8 2.04-1.82 2.04Z"
                />
              </svg>
              Join Discord
              <span aria-hidden="true">↗</span>
            </a>
          </nav>
        </div>

        <footer>
          <span>Flyx 3.0</span>
          <span>MIT licensed</span>
          <span>Built in the open</span>
        </footer>
      </section>
    </main>
  </body>
</html>
