# Flyx desktop packaging config (electron-builder).
# Invoked from packages/desktop (npm run dist) — paths are relative to this file.
# The embedded Next.js standalone server (.flyx-standalone) ships in
# extraResources so native binaries (sharp, @next/swc) run from real disk,
# never from inside the asar.

appId: com.flyx.desktop
productName: Flyx
# Linux AppImage rejects the default executable name electron-builder
# derives from the workspace package name "@flyx/desktop" -> "@flyxdesktop".
executableName: flyx

directories:
  output: dist
  buildResources: build

files:
  - main.js
  - preload.js
  - src/**/*.js
  - package.json

extraResources:
  - from: ../../.flyx-standalone
    to: server
  # The runtime window/tray icon. Ships unpacked (not in the asar) because
  # nativeImage/Chromium load icons from real disk.
  - from: build/icon.png
    to: icon.png

asar: true
npmRebuild: false

# Electron fuses — flipped by electron-builder after afterPack, right before
# signing (app-builder-lib 26 `electronFuses`, passed to @electron/fuses).
electronFuses:
  # MUST stay true: on Windows/Linux the embedded server runs as
  # process.execPath + ELECTRON_RUN_AS_NODE=1 (server-manager.js, also the
  # utilityProcess fallback), and the updater's relaunch helper does the
  # same (main.js launchDetachedAfterDelay). The env var is only honoured
  # for the Flyx binary itself; server .env keys can't set it (env filter).
  runAsNode: true
  # OFF on purpose (was on in 3.2.5–3.2.7). On macOS the key lives in the
  # Keychain as "Flyx Safe Storage", and our ad-hoc signature changes with
  # every release, so macOS asked users to allow access after each update.
  # It protected little: the cookies it encrypted are less sensitive than
  # the plaintext .env beside them (JWT_SECRET, FLYX_MASTER_TOKEN). Cookies
  # already encrypted become unreadable once, and desktop auto-login signs
  # the window back in. Revisit only with a real Apple Developer ID.
  enableCookieEncryption: false
  # Nothing in Flyx (main process or server child) relies on NODE_OPTIONS /
  # NODE_EXTRA_CA_CERTS; turning them off also covers the RunAsNode child.
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  # asar: true above → the app code is in app.asar, so it can be pinned.
  # (Validation is enforced on macOS + Windows; the server payload lives in
  # extraResources and is NOT covered by asar integrity.)
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
  # Flipping fuses edits the binary AFTER build/after-pack.cjs ad-hoc signed
  # the .app, which would leave Apple silicon with a broken signature
  # ("Flyx is damaged"). This re-runs `codesign --sign - --force --deep` on
  # the .app after flipping. No-op for the Windows/Linux binaries.
  resetAdHocDarwinSignature: true

# Code signing: no certificate yet. Do NOT set win.verifyUpdateCodeSignature /
# publisherName until builds are signed — electron-updater would then reject
# every (unsigned) update. Update integrity comes from latest.yml sha512
# (electron-updater) and from src/github-updater.js verifyDownload().

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.png

nsis:
  oneClick: false
  # perMachine is left at its default (false): the assisted installer asks
  # "just me" vs "all users". NOTE (ACL): an all-users install into a custom
  # folder outside Program Files (e.g. C:\Flyx) inherits that folder's ACLs,
  # which are often user-writable — any local user could then replace
  # binaries that other users run. electron-builder has no option to lock
  # the ACL; recommend Program Files for all-users installs.
  allowToChangeInstallationDirectory: true
  artifactName: Flyx-Setup-${version}.${ext}

portable:
  artifactName: Flyx-Portable-${version}.${ext}

# Build hooks (see build/*.cjs):
#  - afterPack: ad-hoc code-sign the macOS app and force executable bits on
#    the launcher + bundled ffmpeg (macOS/Linux). Without a signature Apple
#    silicon refuses the app as "damaged" after every update.
#  - afterAllArtifactBuild: executable bit on the published AppImage.
afterPack: build/after-pack.cjs
afterAllArtifactBuild: build/after-artifacts.cjs

mac:
  target: [dmg]
  icon: build/icon.png
  category: public.app-category.entertainment
  # No Apple developer identity: let electron-builder skip its own signing
  # (it would only log a warning) — the afterPack hook ad-hoc signs instead.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  artifactName: Flyx-${version}.${ext}

linux:
  target: [AppImage, deb]
  icon: build/icon.png
  category: AudioVideo
  maintainer: Vynx-Velvet
  synopsis: Flyx — privacy-first streaming server
  artifactName: Flyx-${version}.${ext}

publish:
  provider: github
  releaseType: release
