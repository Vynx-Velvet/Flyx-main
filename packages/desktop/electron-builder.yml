# Flyx desktop packaging config (electron-builder).
# Invoked from packages/desktop (npm run dist) — paths are relative to this file.
# The embedded Next.js standalone server (.flyx-standalone) ships in
# extraResources so native binaries (sharp, @next/swc) run from real disk,
# never from inside the asar.

appId: com.flyx.desktop
productName: Flyx
# Linux AppImage rejects the default executable name electron-builder
# derives from the workspace package name "@flyx/desktop" -> "@flyxdesktop".
executableName: flyx

directories:
  output: dist
  buildResources: build

files:
  - main.js
  - preload.js
  - src/**/*.js
  - package.json

extraResources:
  - from: ../../.flyx-standalone
    to: server
  # The runtime window/tray icon. Ships unpacked (not in the asar) because
  # nativeImage/Chromium load icons from real disk.
  - from: build/icon.png
    to: icon.png

asar: true
npmRebuild: false

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: Flyx-Setup-${version}.${ext}

portable:
  artifactName: Flyx-Portable-${version}.${ext}

# Build hooks (see build/*.cjs):
#  - afterPack: ad-hoc code-sign the macOS app and force executable bits on
#    the launcher + bundled ffmpeg (macOS/Linux). Without a signature Apple
#    silicon refuses the app as "damaged" after every update.
#  - afterAllArtifactBuild: executable bit on the published AppImage.
afterPack: build/after-pack.cjs
afterAllArtifactBuild: build/after-artifacts.cjs

mac:
  target: [dmg]
  icon: build/icon.png
  category: public.app-category.entertainment
  # No Apple developer identity: let electron-builder skip its own signing
  # (it would only log a warning) — the afterPack hook ad-hoc signs instead.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  artifactName: Flyx-${version}.${ext}

linux:
  target: [AppImage, deb]
  icon: build/icon.png
  category: AudioVideo
  maintainer: Vynx-Velvet
  synopsis: Flyx — privacy-first streaming server
  artifactName: Flyx-${version}.${ext}

publish:
  provider: github
  releaseType: release
