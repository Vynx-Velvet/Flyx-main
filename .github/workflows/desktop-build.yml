name: Desktop Build

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    # Tag builds publish the GitHub release via GITHUB_TOKEN — needs write.
    # (Repo default token permissions are often read-only.)
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # latest 22.x (>= 22.12 required — Electron's install script uses require(ESM))
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm only records the lockfile-generating platform's optional native
      # deps (our lockfile was made on Windows), so `npm ci` on macOS/Linux
      # skips them and `next build` dies on Tailwind's native modules.
      # Install the current platform's variants explicitly. Versions must
      # match the lockfile — bump them when Tailwind/lightningcss upgrades.
      - name: Install platform-native deps (missing from lockfile)
        if: runner.os != 'Windows'
        run: npm install --no-save --ignore-scripts lightningcss@1.32.0 @tailwindcss/oxide@4.3.3

      - name: Build standalone server
        run: node scripts/build-desktop.mjs
        env:
          # Insurance for build-time env access — real config is injected at runtime
          TMDB_API_KEY: dummy-key-for-build
          JWT_SECRET: dummy-secret-for-build-0123456789abcdef
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Package (publish on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run dist:publish --workspace=@flyx/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Package (branch push — artifacts only)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run dist --workspace=@flyx/desktop
        env:
          # publish: github is configured in electron-builder.yml, which
          # makes plain `dist` construct the publisher — it needs a token
          # even though nothing is uploaded on branch builds.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v7
        with:
          name: flyx-desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.yml
            packages/desktop/dist/*.blockmap
