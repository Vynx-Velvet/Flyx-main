name: Desktop Build

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

# Least privilege by default. Only the `release` job (tag pushes) gets
# contents: write, and it runs no npm install / build scripts — it only
# uploads artifacts produced by the read-only `build` job.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Third-party actions are pinned to full commit SHAs (tag in comment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # latest 22.x (>= 22.12 required — Electron's install script uses require(ESM))
          node-version: 22
          cache: npm

      # Install scripts stay enabled: electron, esbuild and sharp fetch their
      # platform binaries in postinstall, and the build needs all three.
      # This job's token is read-only, so a malicious install script can't
      # push or publish.
      - name: Install dependencies
        run: npm ci

      # npm only records the lockfile-generating platform's optional native
      # deps (our lockfile was made on Windows), so `npm ci` on macOS/Linux
      # skips them and `next build` dies on Tailwind's native modules.
      # Install the current platform's variants explicitly. Versions must
      # match the lockfile — bump them when Tailwind/lightningcss upgrades.
      - name: Install platform-native deps (missing from lockfile)
        if: runner.os != 'Windows'
        run: npm install --no-save --ignore-scripts lightningcss@1.32.0 @tailwindcss/oxide@4.3.3

      - name: Build standalone server
        run: node scripts/build-desktop.mjs
        env:
          # Insurance for build-time env access — real config is injected at runtime
          TMDB_API_KEY: dummy-key-for-build
          JWT_SECRET: dummy-secret-for-build-0123456789abcdef
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # Package only — never publish from this job. `publish: github` in
      # electron-builder.yml still makes electron-builder construct the
      # publisher (and write latest*.yml update metadata), which wants a
      # token; the read-only GITHUB_TOKEN is enough for that.
      - name: Package
        run: npm run dist --workspace=@flyx/desktop -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flyx-desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/latest*.yml
            packages/desktop/dist/*.blockmap

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The only job with write access. No checkout of build tooling, no npm:
    # it just uploads the artifacts the build matrix produced, the same
    # files electron-builder's `--publish always` used to upload
    # (installers, blockmaps and latest*.yml for electron-updater).
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: flyx-desktop-*
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -la release-assets
          # electron-builder names the release after the version (tag minus "v").
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --verify-tag --title "${TAG#v}" --notes ""
          fi
